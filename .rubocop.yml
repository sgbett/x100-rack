AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"
    - "lib/x100/wallet_manager.rb"

Metrics/MethodLength:
  Max: 25
  Exclude:
    - "lib/x100/wallet_manager.rb"

Metrics/ClassLength:
  Exclude:
    - "lib/x100/wallet_manager.rb"

Metrics/AbcSize:
  Exclude:
    - "lib/x100/wallet_manager.rb"

Naming/PredicateMethod:
  AllowedMethods:
    - unlock!
